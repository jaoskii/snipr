name: media_shrink
description: "A fast, privacy-first mobile app for trimming gaming highlights, compressing to Discord limits, and annotating screenshots."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Native Media & Compression
  ffmpeg_kit_flutter_new: ^3.1.0
  video_player: ^2.8.6
  image_picker: ^1.1.0
  photo_manager: ^3.0.0
  
  # Sharing & Storage
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # UI & Design
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  sqflite: ^2.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
