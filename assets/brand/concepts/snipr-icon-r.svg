<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>snipr app icon — film R</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52E6D8"/>
      <stop offset="1" stop-color="#16A497"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F4F2"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#06514B" flood-opacity="0.5"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="tileClip"><rect x="52" y="40" width="920" height="920" rx="220"/></clipPath>
    <!-- snip: leg cut off right of the stem -->
    <clipPath id="keep"><polygon points="0,0 1024,0 1024,445 478,609 478,1024 0,1024"/></clipPath>
    <clipPath id="snipped"><polygon points="478,619 1024,455 1024,1024 478,1024"/></clipPath>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <g fill="#000000"><rect x="343" y="282" width="24" height="18" rx="4"/><rect x="433" y="282" width="24" height="18" rx="4"/><rect x="343" y="322" width="24" height="18" rx="4"/><rect x="433" y="322" width="24" height="18" rx="4"/><rect x="343" y="362" width="24" height="18" rx="4"/><rect x="433" y="362" width="24" height="18" rx="4"/><rect x="343" y="402" width="24" height="18" rx="4"/><rect x="433" y="402" width="24" height="18" rx="4"/><rect x="343" y="442" width="24" height="18" rx="4"/><rect x="433" y="442" width="24" height="18" rx="4"/><rect x="343" y="482" width="24" height="18" rx="4"/><rect x="433" y="482" width="24" height="18" rx="4"/><rect x="343" y="522" width="24" height="18" rx="4"/><rect x="433" y="522" width="24" height="18" rx="4"/><rect x="343" y="562" width="24" height="18" rx="4"/><rect x="433" y="562" width="24" height="18" rx="4"/><rect x="343" y="602" width="24" height="18" rx="4"/><rect x="433" y="602" width="24" height="18" rx="4"/><rect x="343" y="642" width="24" height="18" rx="4"/><rect x="433" y="642" width="24" height="18" rx="4"/><rect x="343" y="682" width="24" height="18" rx="4"/><rect x="433" y="682" width="24" height="18" rx="4"/><rect x="343" y="722" width="24" height="18" rx="4"/><rect x="433" y="722" width="24" height="18" rx="4"/></g>
    </mask>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="52" y="72" width="920" height="920" rx="220" fill="#0E6E67"/>
    <rect x="52" y="40" width="920" height="920" rx="220" fill="url(#face)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <ellipse cx="512" cy="120" rx="560" ry="300" fill="url(#gloss)"/>
  </g>
  <rect x="58" y="46" width="908" height="908" rx="214" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <!-- glyph: italic R, film-strip stem, snipped leg -->
  <g filter="url(#drop)" transform="translate(-48 0) translate(512 512) skewX(-10) translate(-512 -512)">
    <g clip-path="url(#keep)" fill="url(#glyph)" mask="url(#holes)"><path fill-rule="evenodd" d="M330 260 H590 C690 260 750 320 750 405 C750 470 715 520 655 540 L795 760 H675 L548 552 H470 V760 H330 Z M470 335 V475 H585 C635 475 665 445 665 405 C665 365 635 335 585 335 Z"/></g>
    <g clip-path="url(#snipped)" fill="url(#glyph)" transform="translate(30 26)"><path fill-rule="evenodd" d="M330 260 H590 C690 260 750 320 750 405 C750 470 715 520 655 540 L795 760 H675 L548 552 H470 V760 H330 Z M470 335 V475 H585 C635 475 665 445 665 405 C665 365 635 335 585 335 Z"/></g>
    <line x1="560" y1="603" x2="696" y2="562" stroke="#FF2BD6" stroke-width="18" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
    <line x1="560" y1="603" x2="696" y2="562" stroke="#FF4FD9" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
